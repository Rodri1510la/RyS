<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R Y S</title>
    <link rel="stylesheet" href="css/record.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
      <!-- Swiper CSS -->
      <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap');
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/efectos.css">
    <link rel="stylesheet" href="css/nav.css">
  </head>
<body data-hearts>
    
    <br />
    <h1>
        Record Actual<span>: 342</span>
    </h1>
    <div class="swiper-container reveal">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="img/Record/333.jpeg" alt="Image 1"></div>
            <div class="swiper-slide"><img src="img/Record/339.jpeg" alt="Image 2"></div>
            <div class="swiper-slide"><img src="img/Record/actual.jpeg" alt="Image 3"></div>

            
            
            <!-- Agrega más imágenes estáticas según sea necesario -->
        </div>
        <!-- Add Pagination -->
        <div class="swiper-pagination"></div>
        <!-- Add Navigation -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <!-- Initialize Swiper -->
    <script>
        var swiper = new Swiper('.swiper-container', {
            slidesPerView: 1,
            spaceBetween: 10,
            loop: true,
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
    </script>
  <script src="js/efectos.js" defer></script>
  <script src="js/nav.js" defer></script>
</body>
</html>
