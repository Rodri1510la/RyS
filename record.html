<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récord de basket</title>
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Oswald:wght@300;400;600&family=Doto:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/efectos.css">
    <link rel="stylesheet" href="css/record.css">
    <link rel="stylesheet" href="css/nav.css">
</head>
<body data-hearts>

<main class="pagina">
    <header class="portada">
        <h1>Récord actual</h1>
        <div class="marcador" role="img" aria-label="342 puntos">
            <span class="cifra" id="cifra" aria-hidden="true" data-meta="342">342</span>
        </div>
        <p class="sub">Nuestro marcador más alto en el Alley Oop</p>
    </header>

    <section class="camino" aria-labelledby="camino-titulo">
        <h2 id="camino-titulo">Cómo fue subiendo</h2>
        <ol>
            <li>
                <figure class="foto reveal">
                    <img src="img/Record/333.jpeg" alt="Marcador del Alley Oop con 333 puntos" data-zoom data-caption="333 puntos" loading="lazy">
                    <figcaption><span class="pts">333</span><span class="delta">Primer registro</span></figcaption>
                </figure>
            </li>
            <li>
                <figure class="foto reveal">
                    <img src="img/Record/339.jpeg" alt="Marcador del Alley Oop con 339 puntos" data-zoom data-caption="339 puntos" loading="lazy">
                    <figcaption><span class="pts">339</span><span class="delta">+6 que el anterior</span></figcaption>
                </figure>
            </li>
            <li>
                <figure class="foto foto--actual reveal">
                    <img src="img/Record/actual.jpeg" alt="Marcador del Alley Oop con 342 puntos" data-zoom data-caption="342 puntos, el récord actual" loading="lazy">
                    <figcaption><span class="pts">342</span><span class="delta">+3 y es el récord actual</span></figcaption>
                </figure>
            </li>
        </ol>
    </section>
</main>

<script src="js/record.js" defer></script>
<script src="js/efectos.js" defer></script>
<script src="js/nav.js" defer></script>
</body>
</html>
