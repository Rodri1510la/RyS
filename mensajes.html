  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJ9GKC0aZTJrFJUZYqAWfZFkH6gAMw0NA",
      authDomain: "rodsilv-020324.firebaseapp.com",
      databaseURL: "https://rodsilv-020324-default-rtdb.firebaseio.com",
      projectId: "rodsilv-020324",
      storageBucket: "rodsilv-020324.appspot.com",
      messagingSenderId: "813682852258",
      appId: "1:813682852258:web:186b3936944957d46932fb",
      measurementId: "G-L72HCBN0Q0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

   function formatearHora(timestamp) {
  const fecha = new Date(timestamp);
  const dia = fecha.getDate().toString().padStart(2, '0');
  const mes = (fecha.getMonth() + 1).toString().padStart(2, '0');
  const año = fecha.getFullYear();
  const horas = fecha.getHours().toString().padStart(2, '0');
  const minutos = fecha.getMinutes().toString().padStart(2, '0');
return `${dia}/${mes}/${año} ${horas}:${minutos}`;
}

    window.addEventListener("DOMContentLoaded", () => {
      const nombreInput = document.getElementById("nombre");

      // Cargar el nombre guardado si existe
      const nombreGuardado = localStorage.getItem("nombreChat");
      if (nombreGuardado) {
        nombreInput.value = nombreGuardado;
      }

      // Guardar el nombre cuando se cambia
      nombreInput.addEventListener("change", () => {
        localStorage.setItem("nombreChat", nombreInput.value);
      });

      const mensajeInput = document.getElementById("mensaje");
      const chatBox = document.getElementById("chat-box");
      const enviarBtn = document.getElementById("enviar");

      enviarBtn.addEventListener("click", () => {
        const nombre = nombreInput.value.trim();
        const mensaje = mensajeInput.value.trim();
        if (nombre && mensaje) {
          push(ref(db, "mensajes"), {
            nombre,
            mensaje,
            timestamp: Date.now()
          });
          mensajeInput.value = "";
        }
      });

      onChildAdded(ref(db, "mensajes"), (data) => {
        const msg = data.val();
        const clase = msg.nombre === "Silvana" ? "silvana" : "rodrigo";
        const hora = formatearHora(msg.timestamp);

        const div = document.createElement("div");
        div.className = `message ${clase} fade-in`;
       div.innerHTML = `
        <strong>${msg.nombre}:</strong> ${msg.mensaje}
        <div class="hora">${hora}</div>
      `;

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    });
  </script>

  <style>

    #chat-box {

    select, input[type="text"] {

    }

    input[type="text"] {

    }

    button {

      background-color: #002B7F;
      color: white;

    button:hover {

    .message {

      animation: fadeIn 0.4s ease;

    .silvana {
      background-color: #ffe6f0;
      color: #99004d;
      align-self: flex-start;
      border-bottom-left-radius: 0;
    }

    .rodrigo {
      background-color: #e6f0ff;
      color: #003380;
      align-self: flex-end;
      border-bottom-right-radius: 0;
    }

    .hora {
      font-size: 11px;
      color: #666;
      text-align: right;
      margin-top: 4px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.4s ease;
    }
  </style>
