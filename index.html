<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adios Silvana</title>
  <link rel="stylesheet" href="css/styles2.css">
  <style>
    .back-button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #111111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .back-button:hover {
      background-color: #3a3a3a;
    }

    /* ---- Despedida: un ADIOS grande y limpio ---- */
    .card.goodbye {
      padding: 48px 24px 40px;
      max-width: 640px;
    }

    .goodbye-kicker {
      display: block;
      font-family: 'Oswald', 'Segoe UI', sans-serif;
      font-weight: 300;
      font-size: clamp(0.68rem, 2.6vw, 0.82rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #8a8a8a;
      margin: 0 0 6px;
    }

    .goodbye-title {
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
      font-size: clamp(5rem, 22vw, 11rem);
      line-height: 0.95;
      margin: 0 0 8px;
      padding-bottom: 6px;
      color: #cc0000;
      background: linear-gradient(180deg, #ff4d6d 0%, #cc0000 55%, #7a0018 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 8px 24px rgba(204, 0, 0, 0.28));
      animation: goodbye-in 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    @keyframes goodbye-in {
      from { opacity: 0; transform: scale(0.92) translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    .goodbye-line {
      width: clamp(70px, 30%, 160px);
      height: 1px;
      margin: 18px auto 26px;
      background: linear-gradient(90deg, transparent, #ff9ebb, transparent);
    }

    .goodbye-note {
      font-size: clamp(0.95rem, 3vw, 1.08rem);
      line-height: 1.7;
      color: #7a6a70;
      max-width: 30ch;
      margin: 0 auto;
      font-style: italic;
    }

    .goodbye .gif {
      margin-top: 28px;
      max-width: 260px;
    }

    @media (max-width: 480px) {
      .card.goodbye { padding: 36px 18px 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .goodbye-title { animation: none; }
    }
  </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/efectos.css">
  </head>
<body>
  <div class="card goodbye reveal">
    <span class="goodbye-kicker">Ya no hay más que decir</span>
    <h1 class="goodbye-title">Adiós</h1>
    <div class="goodbye-line"></div>
    <p class="goodbye-note">Gracias por todo.<br>Ahora me toca elegirme a mí.</p>

    <img src="https://media3.giphy.com/media/WRVwEww2fPssLkiJR9/giphy.gif?cid=6c09b952d5ersd1ocw83xt9azndpjc72if140d8bvcfkk9x4&ep=v1_internal_gif_by_id&rid=giphy.gif&ct=s" alt="Despedida" class="gif">

    <!-- Botón debajo de la imagen -->
    <a href="https://drive.google.com/drive/folders/1DdNf_kprWidRtUxc4qpgSfvuiJtFhhfm?usp=drive_link"
       class="back-button" target="_blank" rel="noopener noreferrer">Promesas son Promesas</a>
  </div>

  <!-- El autoplay lo bloquea el navegador; la musica se inicia con el primer
       toque mediante el botoncito flotante. -->
  <button id="musicBtn" type="button" aria-label="Reproducir o pausar la musica">▶</button>
  <audio id="bgMusic" loop>
    <source src="audio/04 - Puente.mp3" type="audio/mpeg">
    Tu navegador no soporta audio HTML5.
  </audio>
  <script>
    var bgMusic = document.getElementById("bgMusic");
    var musicBtn = document.getElementById("musicBtn");
    musicBtn.addEventListener("click", function () {
      if (bgMusic.paused) {
        bgMusic.play().catch(function () {});
        musicBtn.textContent = "⏸";
      } else {
        bgMusic.pause();
        musicBtn.textContent = "▶";
      }
    });
  </script>
  <script src="js/efectos.js" defer></script>
</body>
</html>
